[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brier-pipeline"
version = "0.1.0"
description = "Brier ingestion, extraction, resolution, and scoring pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
    # Coverage as a CI gate (ADR-0015, Track T3). Dev-only; plain `coverage`
    # (not pytest-cov) so `make check`'s pytest stays instrumentation-free —
    # coverage runs as the separate `make coverage` target.
    "coverage[toml]>=7.4",
]

[tool.setuptools.packages.find]
include = ["brier_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# faster-whisper is an optional, ADR-0003-gated dependency, intentionally not
# installed in CI/dev; it is lazily imported only on the GPU backfill host
# (transcription/transcriber.py). Tell mypy not to error on its absent stubs.
[[tool.mypy.overrides]]
module = ["faster_whisper"]
ignore_missing_imports = true

# boto3 is an optional, ADR-0004-gated dependency, intentionally not installed
# in CI/dev; it is lazily imported only in R2Storage on the production host
# (transcription/storage.py). Tell mypy not to error on its absent stubs.
[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

# sentence-transformers is an optional, ADR-0008-gated dependency, intentionally
# not installed in CI/dev; it is lazily imported only in SentenceTransformerEmbedder
# on the host(s) running dedup_claims (extraction/embeddings.py).
# Tell mypy not to error on its absent stubs.
[[tool.mypy.overrides]]
module = ["sentence_transformers"]
ignore_missing_imports = true

# ccxt is an optional, ADR-gated dependency for the EC-8 cross-check adapter,
# intentionally not installed in CI/dev. It is lazily imported only inside
# CcxtCrossCheckSource._get_exchange (resolution/prices.py) when no injected
# exchange_factory is supplied. Tell mypy not to error on its absent stubs.
[[tool.mypy.overrides]]
module = ["ccxt"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Coverage gate (ADR-0015, Track T3). `make coverage` runs `coverage run -m
# pytest` then `coverage report`, which fails under the floor. Line coverage
# over the pipeline package (branch coverage is a future ratchet).
[tool.coverage.run]
source = ["brier_pipeline"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet floor — only ever moves up (ADR-0015). Measured baseline 2026-06-28:
# 89.92% line coverage (3235 stmts, 326 missed; displays as 90%). Floor set one
# point below the baseline for a stable green; ratchet to 90 once the Track-T
# hardening tests (SLA/freshness/deletion + broad pass) push the measured number
# comfortably past it.
fail_under = 89
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
