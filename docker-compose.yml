services:
  db:
    image: pgvector/pgvector:pg16
    container_name: brier-db
    environment:
      POSTGRES_USER: brier
      POSTGRES_PASSWORD: brier
      POSTGRES_DB: brier
    ports:
      - "5432:5432"
    volumes:
      - brier-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brier -d brier"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  brier-pgdata:
