name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The full quality gate: copy-lint (AC-7 firewall), ruff, mypy, pytest,
      # tsc, eslint. Database-backed tests skip in CI (no service container by
      # design — the skeleton gate must stay fast and hermetic).
      - run: make check
