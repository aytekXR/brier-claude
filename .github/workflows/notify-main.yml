# Dummy CI pipeline — fires on every push to `main` so GitHub sends the
# repository owner an email about the push.
#
# How the email happens (no SMTP secrets required):
#   * GitHub emails the pusher automatically when ANY workflow run on a branch
#     they pushed FAILS (default, no setup needed).
#   * To also receive an email on SUCCESSFUL runs, enable it once per account:
#     GitHub → Settings → Notifications → "Actions" → check "Send notifications
#     for failed workflows only" OFF (i.e. notify on all runs), and make sure
#     you Watch this repository (Watch ▸ All Activity, or Custom ▸ Actions).
#
# This pipeline is intentionally minimal and hermetic (no toolchain, no network,
# no DB). The substantive quality gate lives in ci.yml (`make check`).

name: notify-main

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a run (and its email) by hand from the Actions tab

permissions:
  contents: read

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  notify:
    name: Push to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Summarize the push
        run: |
          {
            echo "## Push to \`main\` received"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | ${GITHUB_REPOSITORY} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Pusher | ${GITHUB_ACTOR} |"
            echo "| Ref | ${GITHUB_REF} |"
            echo "| Run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo ""
            echo "_Brier notify-main pipeline. GitHub emails the pusher on failed runs by default;"
            echo "enable Settings ▸ Notifications ▸ Actions for an email on every run._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "notify-main: push to main by ${GITHUB_ACTOR} at ${GITHUB_SHA}"

      - name: Notify Slack on success
        if: success()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          MSG=${MSG:-"(no commit message)"}

          TEXT=$(printf '✅ Build succeeded\n\nRepo: %s\nWorkflow: %s\nTime: %s\nCommit: %s - %s' \
            "${GITHUB_REPOSITORY##*/}" \
            "$GITHUB_WORKFLOW" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" \
            "${GITHUB_SHA:0:7}" \
            "$MSG")

          jq -n --arg text "$TEXT" '{text: $text}' |
            curl -sf \
              -X POST \
              -H "Content-type: application/json" \
              --data @- \
              "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack success notification failed"

      - name: Notify Slack on failure
        if: failure()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -n1)
          MSG=${MSG:-"(no commit message)"}

          TEXT=$(printf '❌ Build failed\n\nRepo: %s\nWorkflow: %s\nJob: %s\nBranch: %s\nActor: %s\nCommit: %s - %s\nRun: %s\nTime: %s' \
            "${GITHUB_REPOSITORY##*/}" \
            "$GITHUB_WORKFLOW" \
            "$GITHUB_JOB" \
            "$GITHUB_REF_NAME" \
            "$GITHUB_ACTOR" \
            "${GITHUB_SHA:0:7}" \
            "$MSG" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$(date -u '+%Y-%m-%d %H:%M UTC')")

          jq -n --arg text "$TEXT" '{text: $text}' |
            curl -sf \
              -X POST \
              -H "Content-type: application/json" \
              --data @- \
              "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack failure notification failed"