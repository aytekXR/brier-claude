# =============================================================================
# nginx site block — brier.beyondkaira.com
#
# The host-nginx replacement for the shared, container-Caddy block committed at
# deploy/Caddyfile.brier.snippet (authoritative copy lives in the ams-pulse repo
# `brier.{$PULSE_DOMAIN}` block). This is ADDITIVE: it does not touch the live
# Caddy config. It goes live only during the windowed Caddy -> nginx :443 cutover
# in deploy/MIGRATION.md.
#
# Install (owner, one-time — see deploy/MIGRATION.md):
#   sudo cp deploy/nginx/brier.beyondkaira.com.conf \
#           /etc/nginx/sites-available/brier.beyondkaira.com.conf
#   sudo ln -sfn /etc/nginx/sites-available/brier.beyondkaira.com.conf \
#                /etc/nginx/sites-enabled/brier.beyondkaira.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# UPSTREAM — Next.js `next start` CANNOT bind a unix socket, so the web app keeps
# its existing port 3000 but is rebound to the PRIVATE loopback 127.0.0.1:3000 by
# the new unit deploy/brier-web-nginx.service. This is the security fix: the old
# container-Caddy had to reach the app over the host's PUBLIC IP (161.97.172.146
# :3000, internet-reachable, raw app, no TLS — see the old brier-web.service and
# INSTALL.md §5b). Host-nginx reaches 127.0.0.1 directly, so :3000 never faces the
# internet and the port-3000 firewall workaround is no longer needed.
#
# ROUTING — Brier has NO path splits: `next start` serves the entire site,
# including the /api/health probe (a Next route handler, apps/web/app/api/health/
# route.ts). So everything is one `location /` to the web upstream; there is no
# separate api/worker upstream (the worker drains a Postgres jobs table and has no
# HTTP surface).
#
# HEADERS — the Caddy block only stripped its `Server` header (`header -Server`)
# and forwarded Host / X-Real-IP / X-Forwarded-For; it set NO CSP/HSTS. Brier's
# app owns its full security-header set in apps/web/next.config.ts (a YouTube-
# tuned CSP, 2-year HSTS, X-Content-Type-Options, X-Frame-Options: DENY,
# Referrer-Policy, Permissions-Policy) and those pass through nginx unchanged.
# To satisfy the edge baseline WITHOUT emitting duplicate/conflicting headers,
# nginx is authoritative for the three simple hardening headers below (hide the
# upstream copy, re-add a single one whose value MIRRORS next.config.ts), and
# lets the app own CSP / Referrer-Policy / Permissions-Policy end to end.
# =============================================================================

upstream brier_web {
    # Next.js private-loopback bind (deploy/brier-web-nginx.service, -H 127.0.0.1).
    server 127.0.0.1:3000;
    keepalive 16;
}

# Port 80: serve the ACME HTTP-01 challenge for renewal, redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name brier.beyondkaira.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brier.beyondkaira.com;

    # ONE SAN cert named beyondkaira.com (HTTP-01 via certbot --nginx, auto-
    # renewing) covers this subdomain — no per-site DNS step.
    ssl_certificate     /etc/letsencrypt/live/beyondkaira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondkaira.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Strip nginx's version/identity (the host-nginx equivalent of Caddy's
    # `header -Server`; also drops the "Server: nginx/x.y" fingerprint on errors).
    server_tokens off;

    # Edge hardening baseline. The app (next.config.ts) already emits these three;
    # hide the upstream copy and re-add a SINGLE header whose value mirrors the
    # app, so there is exactly one of each (no duplicate/conflicting X-Frame-
    # Options) and the header still exists even if a future app change drops it.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Strip any upstream Server fingerprint the app/runtime might set.
    proxy_hide_header Server;

    access_log /var/log/nginx/brier.access.log;
    error_log  /var/log/nginx/brier.error.log;

    # Whole site -> the Next.js web app. /api/health is a route within this app.
    location / {
        proxy_pass http://brier_web;
        proxy_http_version 1.1;
        # Empty Connection enables upstream keepalive (see `keepalive 16` above).
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
